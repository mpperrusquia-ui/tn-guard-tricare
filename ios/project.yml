name: TNGuardTricare
options:
  bundleIdPrefix: org.tnguardtricare
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES
targets:
  TNGuardTricare:
    type: application
    platform: iOS
    sources:
      - path: TNGuardTricare
        excludes:
          - "Info.plist"
    resources:
      - path: TNGuardTricare/Resources
    info:
      path: TNGuardTricare/Info.plist
      properties:
        CFBundleDisplayName: TN Guard Tricare
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tnguardtricare.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: NXT5QTMXP7
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
